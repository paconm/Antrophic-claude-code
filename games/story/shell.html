<title>The Seven Crowns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: full-screen painted scene; HUD on top; story/battle card docked at the bottom like a game dialogue box; System menu as a sliding sheet */
:root{
  --ink:#0b0913; --panel:rgba(14,11,25,.86); --line:rgba(178,160,255,.22);
  --text:#efe9f7; --muted:#a99fbd; --grav:#a48bff; --gold:#e8c36a; --sys:#7fd8ff;
  --hp:#ff6b7f; --mp:#6fa8ff; --good:#7de0a6;
  --display:"Marcellus SC","Cinzel",Georgia,serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.55;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sm{font-size:13px;color:var(--muted);font-family:var(--ui)}
.mut{color:var(--muted)}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin:3px 0 10px}
.bar.big{height:12px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.tag{font-family:var(--ui);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.wk{color:var(--good);border-color:rgba(125,224,166,.4)}.tag.rs{color:#ff9f9f;border-color:rgba(255,159,159,.35)}
.tag.st{color:var(--gold)}.tag.ti{color:var(--gold);border-color:rgba(232,195,106,.45)}.tag.sv{color:var(--sys)}

/* title */
.title{position:fixed;inset:0;z-index:4;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{text-align:center;margin:0 auto 22px;max-width:640px}
.logo .eyebrow{font-family:var(--ui);letter-spacing:.3em;font-size:11px;color:var(--gold);text-transform:uppercase}
.logo h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,12vw,76px);line-height:1;margin:10px 0;letter-spacing:.05em;
  background:linear-gradient(180deg,#fff,#cdbcff 55%,#7d5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{color:var(--muted);font-style:italic;margin:0 auto;max-width:40ch}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px;max-width:1000px;margin:0 auto}
.cc{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column}
.cc .th{width:100%;height:120px;display:block}
.ci{padding:12px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.ci h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:.03em}
.ci p{margin:4px 0;font-size:15px;color:#d8d0e6;flex:1}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--ui);font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--ec);color:var(--ec)}
.nm{display:flex;flex-direction:column;gap:4px;font-family:var(--ui);font-size:12px;color:var(--muted)}
.nm input{font:16px var(--body);background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px}
.cbtn{display:flex;gap:8px;margin-top:6px}
.btn{flex:1;font-family:var(--display);letter-spacing:.08em;font-size:15px;border-radius:12px;padding:11px 14px;cursor:pointer;border:1px solid var(--gold);background:linear-gradient(180deg,#3b2a6e,#21173f)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}

/* game */
.app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.hud{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding-top:10px;max-width:680px;width:100%;align-self:center}
.hn{display:flex;align-items:center;gap:8px;font-family:var(--ui);text-shadow:0 1px 6px #000}
.hn b{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.04em}
.rk,.rkbig{font-family:var(--ui);font-weight:600;border-radius:6px;padding:0 7px;font-size:13px;border:1px solid currentColor}
.rF,.rE{color:#b8b8c8}.rD,.rC{color:#7fd8ff}.rB{color:#a48bff}.rA{color:#ffb36a}.rS{color:#ffe07a}
.lv{font-size:13px;color:var(--muted)}
.xpb{grid-column:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}.xpb i{display:block;height:100%;background:var(--gold)}
.stbtn{grid-row:1/3;grid-column:2;font-family:var(--ui);font-weight:600;font-size:14px;background:rgba(20,30,60,.7);border:1px solid var(--sys);color:var(--sys);border-radius:10px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stbtn.alert{box-shadow:0 0 14px rgba(127,216,255,.55);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 4px rgba(127,216,255,.3)}}
.chapter{font-family:var(--ui);letter-spacing:.14em;font-size:11px;color:var(--gold);text-shadow:0 1px 8px #000;margin-top:8px;text-transform:uppercase;max-width:680px;width:100%;align-self:center}
.stage{flex:1}
#card{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 14px 14px;padding:16px 16px 14px;margin-bottom:10px;max-height:66vh;overflow-y:auto;-webkit-overflow-scrolling:touch;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 -10px 40px rgba(0,0,0,.45);max-width:680px;width:100%;align-self:center}
#card h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0 0 8px;letter-spacing:.04em;text-wrap:balance}
#card p{margin:0 0 10px}
.dlg{margin:0 0 10px;padding-left:12px;border-left:2px solid rgba(232,195,106,.5)}
.dlg .who{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.dlg p{margin:2px 0 0!important;color:#f3ecdf}
.dlg.me{border-left-color:var(--grav)}.dlg.me .who{color:var(--grav)}
.sys{font-family:var(--ui);font-size:14px;color:var(--sys);background:rgba(40,90,140,.18);border:1px solid rgba(127,216,255,.35);border-radius:8px;padding:6px 10px;margin:0 0 8px;letter-spacing:.02em}
.sysbox{font-family:var(--ui);font-size:13px;color:#cdeeff;background:linear-gradient(180deg,rgba(30,70,120,.35),rgba(20,40,80,.25));border:1px solid rgba(127,216,255,.45);border-radius:10px;padding:8px 12px;margin-bottom:12px;box-shadow:0 0 18px rgba(127,216,255,.12) inset}
.syshead{font-weight:600;letter-spacing:.2em;color:var(--sys);font-size:11px;margin-bottom:2px}
.fade{animation:fade .45s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;background:linear-gradient(180deg,rgba(164,139,255,.16),rgba(164,139,255,.06));border:1px solid rgba(164,139,255,.45);border-radius:12px;padding:11px 14px;font-size:16px;line-height:1.35;cursor:pointer;transition:transform .12s,background .2s}
.choice:active{transform:scale(.98)}
.choice:hover{background:rgba(164,139,255,.26)}
.choice small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.choice[disabled]{opacity:.45;cursor:not-allowed;border-style:dashed}
.choice.fight{border-color:rgba(255,107,127,.6);background:linear-gradient(180deg,rgba(255,107,127,.18),rgba(255,107,127,.05))}
.sw{margin-right:6px;color:var(--hp)}
.endgrid,.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.endgrid div,.dgrid div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.endgrid small,.dgrid small{font-family:var(--ui);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dgrid b,.endgrid b{font-family:var(--ui);font-variant-numeric:tabular-nums}

/* battle */
.bt .fname{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.03em}
.ehp{background:linear-gradient(90deg,#ff4d6d,#ff9a6b)}.php{background:var(--hp)}.pmp{background:var(--mp)}
.log{font-size:14px;line-height:1.45;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0 10px;min-height:92px}
.log div{color:var(--muted)}.log div.new,.log div:nth-last-child(-n+3){color:var(--text)}
.log em{color:var(--gold);font-style:normal}
.mebars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.act{text-align:left;border-radius:10px;padding:8px 10px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--ec,var(--line));border-left-width:4px;transition:transform .1s}
.act:active{transform:scale(.97)}
.act b{display:block;font-family:var(--ui);font-weight:600;font-size:14px}
.act small{font-family:var(--ui);font-size:11px;color:var(--muted)}
.act.basic{--ec:rgba(255,255,255,.25)}
.act[disabled]{opacity:.4;cursor:not-allowed}
.result{text-align:center;padding:6px 0}
.result h3{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 0;letter-spacing:.1em}
.result.win h3{color:var(--gold)}.result.lose h3{color:var(--hp)}
.result .choice{text-align:center;width:100%;margin-top:8px}

/* menu */
.menu{position:fixed;inset:0;z-index:6;background:rgba(5,8,18,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.msheet{width:100%;max-width:720px;height:88%;background:linear-gradient(180deg,rgba(14,22,44,.98),rgba(10,10,24,.98));border:1px solid rgba(127,216,255,.4);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(127,216,255,.15);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.mtop{display:flex;align-items:center;gap:8px;padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid rgba(127,216,255,.2)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.tab{font-family:var(--ui);font-weight:600;font-size:13px;background:none;border:1px solid transparent;color:var(--muted);border-radius:8px;padding:6px 8px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--sys);border-color:rgba(127,216,255,.5);background:rgba(127,216,255,.08)}
.mscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));font-family:var(--ui);font-size:14px}
.mscroll h4{font-family:var(--ui);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--sys);margin:18px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mini{font-family:var(--ui);font-weight:600;font-size:13px;background:rgba(127,216,255,.1);border:1px solid rgba(127,216,255,.45);color:var(--sys);border-radius:8px;padding:6px 12px;cursor:pointer}
.mini.on{background:rgba(125,224,166,.15);border-color:var(--good);color:var(--good)}
.mini.learn{background:rgba(232,195,106,.15);border-color:var(--gold);color:var(--gold)}
.win{background:rgba(127,216,255,.05);border:1px solid rgba(127,216,255,.3);border-radius:12px;padding:12px}
.whead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.whead .big{font-family:var(--display);font-size:24px}
.rkbig{font-size:26px;padding:2px 12px;border-radius:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}
.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:600}
.titles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pts{color:var(--gold);font-weight:600;letter-spacing:0;text-transform:none;font-size:13px}
.stat{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.stat small{display:block;color:var(--muted);font-size:12px}
.sv{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.sv em{font-style:normal;color:var(--good);font-size:13px;margin-left:3px}
.plus{width:34px;height:34px;border-radius:8px;border:1px solid var(--gold);background:rgba(232,195,106,.12);color:var(--gold);font-size:20px;cursor:pointer}
.plus[disabled]{opacity:.25;cursor:default}
.load{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.slot{text-align:left;border-radius:8px;padding:8px 10px;border:1px solid var(--ec,var(--line));border-left-width:4px;background:rgba(255,255,255,.04);cursor:pointer;font-family:var(--ui);font-weight:600;font-size:13px}
.slot small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.slot.empty{color:var(--muted);border-style:dashed;cursor:default;font-weight:500}
.eltabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
.eltab{font-family:var(--ui);font-weight:600;font-size:13px;border-radius:999px;padding:5px 12px;cursor:pointer;background:none;border:1px solid var(--ec);color:var(--ec);opacity:.6}
.eltab.on{opacity:1;background:color-mix(in srgb,var(--ec) 16%,transparent)}
.branch{margin-top:14px}
.bh{display:flex;flex-direction:column;margin-bottom:6px}.bh b{font-size:15px;color:var(--text)}.bh small{color:var(--muted)}
.node{border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 11px;margin-bottom:6px;background:rgba(255,255,255,.02);position:relative}
.node.has{border-color:rgba(125,224,166,.45);background:rgba(125,224,166,.05)}
.node.can{border-color:rgba(232,195,106,.55);background:rgba(232,195,106,.06)}
.nt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.nt b{font-size:15px}
.tier{font-size:11px;font-weight:600;color:var(--ink);background:var(--sys);border-radius:4px;padding:0 5px}
.ty{font-size:11px;color:var(--muted);margin-left:auto}
.nd{font-family:var(--body);font-size:14px;color:#d8d0e6;margin:4px 0 6px}
.cdx{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:rgba(255,255,255,.03)}
.cdx summary{cursor:pointer;font-weight:600;color:var(--gold)}
.cdx p{font-family:var(--body);font-size:15px;line-height:1.55;margin:8px 0;color:#e2dbee}
.bond{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.hearts{color:#ff7ea0;letter-spacing:2px;font-size:13px}.hearts .mut{color:rgba(255,255,255,.15)}.neg{color:#ff9f9f;letter-spacing:0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:rgba(14,30,60,.95);border:1px solid var(--sys);color:#cdeeff;font-family:var(--ui);padding:8px 16px;border-radius:999px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}

/* v3: HUD buttons, hearts, tree, store, lives, overlays */
.hud{grid-template-columns:1fr auto}
.hb{grid-row:1/3;grid-column:2;display:flex;gap:6px;align-items:center}
.hbtn{font-family:var(--ui);font-weight:600;font-size:14px;background:rgba(20,16,36,.7);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hbtn.gem{color:#bfe7ff;border-color:rgba(127,216,255,.45)}
.stbtn{grid-row:auto;grid-column:auto}
.scenehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.readbtn{flex:none;font-family:var(--ui);font-size:12px;font-weight:600;background:rgba(232,195,106,.1);border:1px solid rgba(232,195,106,.5);color:var(--gold);border-radius:999px;padding:5px 11px;cursor:pointer;margin-top:2px;white-space:nowrap}
.choice.heart{border-color:rgba(255,158,196,.65);background:linear-gradient(180deg,rgba(255,158,196,.18),rgba(255,158,196,.05))}
.choice.heart small{color:#ffc6dc}
.love{color:#ff9ec4}
.ally{font-family:var(--ui);font-size:13px;color:#ffc6dc;margin:2px 0 4px}
.act.legend{border-color:var(--ec);background:linear-gradient(180deg,rgba(255,211,107,.16),rgba(255,211,107,.04))}
.act.legend b{color:#ffe7a3}
.zoom{margin-left:auto;display:flex;gap:6px}
.sm2{font-size:13px;line-height:1.45;margin:4px 0 8px}
.treebox{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(232,195,106,.35);border-radius:14px;background:#070502;max-height:62vh;box-shadow:0 0 30px rgba(232,195,106,.12) inset}
svg.tree{display:block;min-width:100%;height:auto}
.tree .tn{cursor:pointer;outline:none}
.tree .tn .nb{transition:stroke-width .2s}
.tree .tn.own .nb{fill:url(#tgNode);stroke:#fff3c4;stroke-width:2}
.tree .tn.own .tg{fill:#3a2500;font-weight:700}
.tree .tn.can .nb{fill:#1f1607;stroke:#ffd76e;stroke-width:3;animation:tpulse 1.6s ease-in-out infinite}
.tree .tn.can .tg{fill:#ffe39a}
.tree .tn.lock .nb{fill:#110c06;stroke:#5c4722;stroke-width:1.6;stroke-dasharray:3 3}
.tree .tn.lock .tg{fill:#6b5530}
.tree .tn:focus-visible .nb{stroke:#fff;stroke-width:3}
.tree .selring{fill:none;stroke:#fff;stroke-width:2;opacity:.9}
.tree .tg{font-family:"Segoe UI Symbol","Apple Symbols",var(--ui),sans-serif;pointer-events:none}
.tree .tlab{font-family:var(--ui);font-weight:600;font-size:14px;letter-spacing:.14em}
.tree .rlab{font-family:var(--ui);font-weight:600;font-size:12px;letter-spacing:.14em;fill:#c9a24a}
.tree .clab{font-family:var(--display);font-size:16px;letter-spacing:.3em;fill:#f3d27a}
@keyframes tpulse{50%{stroke-opacity:.35}}
.tdet{margin-top:10px;border:1px solid rgba(232,195,106,.4);border-radius:12px;padding:10px 12px;background:rgba(232,195,106,.06)}
.tdet.empty{color:var(--muted);font-size:13px}
.tdet p{font-family:var(--body);font-size:15px;margin:6px 0;color:#efe6d0}
.tdh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.tdh b{font-size:16px;color:#ffe7a3}
.tdb{margin-top:6px}
.slot.on{background:rgba(255,158,196,.12)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.pcard{text-align:left;border-radius:10px;padding:8px 10px;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;font-family:var(--ui)}
.pcard b{display:block;font-size:14px}.pcard small{color:var(--muted);font-size:11px}
.pcard.on{border-color:#ff9ec4;background:rgba(255,158,196,.1)}
.bcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:rgba(255,255,255,.03)}
.bcard.love{border-color:rgba(255,158,196,.6);background:rgba(255,158,196,.07)}
.bcard .sm{margin-top:2px}
.wallet{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin-bottom:8px}.wallet b{font-variant-numeric:tabular-nums}
.testbanner{font-size:12px;color:#ffe7a3;border:1px dashed rgba(232,195,106,.6);border-radius:10px;padding:7px 10px;background:rgba(232,195,106,.07)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.scard{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-left:3px solid var(--ec,var(--line));border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.03)}
