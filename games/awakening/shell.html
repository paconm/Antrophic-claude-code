<title>Seven Crowns Awakening</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Spectral:ital,wght@0,400;0,600;1,400&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Full-screen 3D canvas; the HUD floats over it and every edge respects the phone's safe areas */
:root{--ink:#07060d;--panel:rgba(12,10,22,.82);--line:rgba(190,170,255,.24);--text:#f1ebf8;--muted:#b0a6c4;--gold:#e8c36a;--sys:#7fd8ff;--hp:#ff6b7f;--good:#7de0a6;
 --display:"Marcellus SC",Georgia,serif;--body:"Spectral",Georgia,serif;--ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;color-scheme:dark;
 --sl:max(14px,env(safe-area-inset-left,0px));--sr:max(14px,env(safe-area-inset-right,0px));--st:calc(env(safe-area-inset-top,0px) + 10px);--sb:calc(env(safe-area-inset-bottom,0px) + 12px)}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ov{position:fixed;inset:0;z-index:5}
/* loading and errors */
#load{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#1a1432,#07060d 70%);text-align:center;padding:0 var(--sr) 0 var(--sl)}
#load h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,64px);letter-spacing:.06em;margin:0;background:linear-gradient(180deg,#fff,#cdbcff 55%,#7d5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
#load p{color:var(--muted);margin:10px 0 0}
/* title */
#title{display:flex;flex-direction:column;justify-content:flex-end;padding:var(--st) var(--sr) var(--sb) var(--sl);background:linear-gradient(180deg,rgba(7,6,13,.55) 0,rgba(7,6,13,0) 26%,rgba(7,6,13,0) 42%,rgba(7,6,13,.9) 78%);pointer-events:none}
#title>*{pointer-events:auto}
.logo{position:absolute;top:var(--st);left:var(--sl);right:var(--sr);text-align:center;pointer-events:none}
.logo .eye{font-size:11px;letter-spacing:.34em;color:var(--gold);text-transform:uppercase}
.logo h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8.5vw,72px);line-height:1;margin:6px 0 2px;letter-spacing:.06em;background:linear-gradient(180deg,#fff,#e9dcff 50%,#a48bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(0,0,0,.6))}
.logo h2{font-family:var(--display);font-weight:400;font-size:clamp(15px,3.6vw,24px);letter-spacing:.42em;margin:0;color:var(--gold);text-shadow:0 1px 10px #000}
.tpanel{width:min(560px,100%);margin:0 auto;display:flex;flex-direction:column;gap:9px}
.heroes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.hb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-width:0}
.hb img{width:100%;max-width:54px;aspect-ratio:1;border-radius:50%;display:block}
.hb span{font-size:11px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.hb.on{border-color:var(--hc,var(--gold));box-shadow:0 0 18px -4px var(--hc,var(--gold)),inset 0 0 14px -8px var(--hc,var(--gold))}
.hinfo{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hinfo b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.04em}
.hinfo .el{font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.hinfo p{margin:4px 0 0;font-family:var(--body);font-size:15px;color:#ddd4ea;line-height:1.4}
.rowx{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:4px;flex:1;min-width:0}
.pill{flex:1;min-width:0;font-size:12px;font-weight:600;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.on{color:var(--sys);border-color:rgba(127,216,255,.6);background:rgba(20,40,70,.8)}
.pill small{display:block;font-weight:500;font-size:10px;opacity:.8}
#nick{flex:1;min-width:0;font:15px var(--ui);background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;-webkit-user-select:text;user-select:text}
.btn{font-family:var(--display);letter-spacing:.14em;font-size:18px;border-radius:14px;padding:13px 16px;border:1px solid var(--gold);background:linear-gradient(180deg,#4a3590,#22174a);box-shadow:0 0 26px -6px #7d5cff}
.btn.ghost{background:var(--panel);border-color:var(--line);color:var(--muted);box-shadow:none;font-size:14px;padding:10px 14px}
.tiny{font-size:12px;color:var(--muted);text-align:center;text-shadow:0 1px 6px #000}
.link{background:none;border:0;color:var(--sys);text-decoration:underline;font-size:12px;padding:4px}
/* HUD */
#hud{pointer-events:none}
#hud>*{pointer-events:auto}
.hl{position:absolute;top:var(--st);left:var(--sl);width:min(46vw,260px);pointer-events:none}
.hname{font-family:var(--display);font-size:18px;letter-spacing:.05em;text-shadow:0 1px 8px #000}
.hname small{font-family:var(--ui);font-size:11px;letter-spacing:.14em;color:var(--gold);margin-left:6px;text-transform:uppercase}
.bar{height:9px;border-radius:5px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d74,#ff9a7a);transform-origin:0 50%}
.hr{position:absolute;top:var(--st);right:var(--sr);display:flex;gap:6px;align-items:flex-start}
.chip{font-size:12px;font-weight:600;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.chip.orb{color:var(--gold);border-color:rgba(232,195,106,.5)}
#fps{position:absolute;top:calc(var(--st) + 40px);right:var(--sr);font-size:11px;color:rgba(255,255,255,.75);text-shadow:0 1px 4px #000;text-align:right;pointer-events:none;font-variant-numeric:tabular-nums}
#obj{position:absolute;top:calc(var(--st) + 50px);left:var(--sl);max-width:min(64vw,420px);font-size:13px;color:#fff;text-shadow:0 1px 6px #000,0 0 14px rgba(0,0,0,.8);border-left:2px solid var(--gold);padding-left:8px;pointer-events:none}
#bossbar{position:absolute;top:calc(var(--st) + 86px);left:50%;transform:translateX(-50%);width:min(70vw,460px);text-align:center;pointer-events:none}
#bossbar b{font-family:var(--display);font-weight:400;letter-spacing:.2em;font-size:14px;color:#d9b8ff;text-shadow:0 1px 8px #000}
#bossbar .bar i{background:linear-gradient(90deg,#7d3cff,#d38bff)}
#subs{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 78px);width:min(680px,calc(100% - var(--sl) - var(--sr)));display:flex;gap:10px;align-items:flex-start;background:rgba(6,5,12,.72);border:1px solid var(--line);border-radius:14px;padding:9px 13px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);pointer-events:none}
#subs img{width:44px;height:44px;border-radius:50%;flex:none;border:1px solid rgba(232,195,106,.6)}
#subs .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#subs p{margin:1px 0 0;font-family:var(--body);font-size:17px;line-height:1.4;color:#f6efe2}
#subs.narr p{font-style:italic}
.keys{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--sb);display:flex;gap:8px}
.kb{position:relative;width:62px;height:62px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;font-size:10px;color:var(--muted);padding:0 3px;text-align:center}
.kb b{font-size:11px;color:var(--text);line-height:1.1}
.kb kbd{font:600 10px var(--ui);color:var(--sys)}
.kb i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(127,216,255,.28)}
/* touch controls */
#touch{display:none;pointer-events:none}
.tb{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,8,20,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;color:#fff;pointer-events:auto;overflow:hidden;touch-action:none}
.tb i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(127,216,255,.3)}
.tb.act{background:rgba(127,216,255,.3)}
#btnA{right:var(--sr);bottom:calc(var(--sb) + 22px);width:84px;height:84px;border-color:var(--gold)}
#btnS{right:calc(var(--sr) + 92px);bottom:calc(var(--sb) + 4px);width:66px;height:66px;border-color:var(--sys)}
#btnJ{right:calc(var(--sr) + 14px);bottom:calc(var(--sb) + 118px);width:62px;height:62px}
#stick{position:absolute;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,8,20,.3);left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 18px);pointer-events:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.5)}
body.touch #touch{display:block}
body.touch .keys{display:none}
body.touch #subs{bottom:calc(var(--sb) + 200px)}
/* cinematic */
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:4;transition:height .9s ease}
.lb.t{top:0}.lb.b{bottom:0}
body.cine .lb{height:11vh}
body.cine #hud .hl,body.cine #hud .hr,body.cine #obj,body.cine .keys,body.cine #touch,body.cine #fps{opacity:0}
#skip{position:fixed;right:var(--sr);bottom:calc(var(--sb) + 2px);z-index:6}
#fade{background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:7}
/* transcendence title */
#asc{position:fixed;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:0 var(--sr) 12vh var(--sl)}
#asc .a0{position:absolute;left:50%;top:44%;width:10px;height:10px;border-radius:50%;border:2px solid var(--ac,#fff);box-shadow:0 0 40px var(--ac,#fff),inset 0 0 40px var(--ac,#fff);animation:ascring 1.6s cubic-bezier(.1,.7,.2,1) both}
#asc .a1{font-family:var(--display);font-size:clamp(34px,10vw,110px);letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase;color:#fff;text-shadow:0 0 24px var(--ac,#a48bff),0 0 70px var(--ac,#a48bff),0 2px 8px #000;animation:asc1 4.6s cubic-bezier(.2,.8,.2,1) both}
#asc .a2{font-family:var(--display);font-size:clamp(15px,3.4vw,30px);letter-spacing:.14em;color:var(--gold);text-shadow:0 1px 10px #000;animation:asc2 4.6s .5s both}
#asc .a3{font-size:clamp(12px,2.4vw,18px);letter-spacing:.24em;text-transform:uppercase;color:#fff;text-shadow:0 1px 8px #000,0 0 18px var(--ac,#a48bff);animation:asc2 4.2s 1.1s both}
#asc .a4{font-size:clamp(11px,2vw,15px);letter-spacing:.2em;color:#cfc6e4;text-shadow:0 1px 8px #000;animation:asc2 3.6s 1.8s both}
#asc .a4 b{color:#fff;text-shadow:0 0 14px #b08bff}
@keyframes asc1{0%{opacity:0;transform:scale(2.4);letter-spacing:1.2em;filter:blur(14px)}16%{opacity:1;transform:scale(1);letter-spacing:.3em;filter:blur(0)}82%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
@keyframes asc2{0%{opacity:0;transform:translateY(14px)}18%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes ascring{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(220);opacity:0}}
/* floating text and name tags */
#fl{pointer-events:none;z-index:3;overflow:hidden}
.ft{position:absolute;left:0;top:0;font-weight:600;font-size:16px;color:#fff;text-shadow:0 1px 4px #000,0 0 10px rgba(160,100,255,.9);will-change:transform;white-space:nowrap}
.ft.big{font-size:22px;color:#ffe7a3}
.nt{position:absolute;left:0;top:0;font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(8,6,16,.6);border:1px solid var(--line);white-space:nowrap;will-change:transform}
/* windows */
.modal{display:flex;align-items:center;justify-content:center;background:rgba(3,3,9,.72);padding:var(--st) var(--sr) var(--sb) var(--sl);z-index:9}
.win{width:min(440px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;border-radius:18px;border:1px solid rgba(127,216,255,.45);background:linear-gradient(180deg,rgba(14,22,42,.97),rgba(9,9,22,.98));padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.win.wide{width:min(620px,100%)}
.win h3{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.05em;margin:0;text-wrap:balance}
.win h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sys);margin:8px 0 0}
.win p{margin:0;font-family:var(--body);font-size:15.5px;line-height:1.5;color:#ddd5ea}
.win ul{margin:0;padding-left:18px;font-family:var(--body);font-size:15.5px;line-height:1.5;color:#ddd5ea}
.win .rowx{justify-content:space-between}
.rw{border-color:var(--rc);box-shadow:0 0 50px -8px var(--rc),inset 0 0 36px -14px var(--rc);align-items:center;text-align:center;position:relative;overflow-x:hidden;animation:rwin .5s cubic-bezier(.2,1.4,.4,1)}
.rw .rays{position:absolute;left:50%;top:170px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;opacity:.7;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 26%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spin 22s linear infinite}
.rw>*{position:relative}
.rw .hd{align-self:stretch;font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--sys);border:1px solid rgba(127,216,255,.45);background:rgba(127,216,255,.08);border-radius:6px;padding:5px 8px}
.rw .tier{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rc);font-weight:600}
.rw canvas{width:min(210px,54vw);aspect-ratio:1;height:auto}
.rw .nm{font-family:var(--display);font-size:28px;line-height:1.1;text-shadow:0 0 18px var(--rc)}
.rw .li{align-self:stretch;text-align:left;font-size:14px;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.05);border-left:2px solid var(--rc)}
.rw .pow{align-self:stretch;text-align:left;padding:9px 11px;border-radius:10px;border:1px solid rgba(255,211,107,.55);background:linear-gradient(180deg,rgba(255,211,107,.15),rgba(255,211,107,.03));font-size:13px;color:#eee3c8}
.rw .pow b{display:block;color:#ffe7a3;font-size:14px}
.rw .btn{align-self:stretch}
.opt{display:flex;gap:6px;flex-wrap:wrap}
.opt button{font-size:13px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted)}
.opt button.on{color:var(--gold);border-color:var(--gold);background:rgba(232,195,106,.1)}
textarea{font:14px var(--ui);width:100%;min-height:70px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);padding:8px 10px;-webkit-user-select:text;user-select:text}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat small{display:block;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stat b{font-size:18px;color:var(--gold)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translateX(-50%);z-index:12;background:rgba(8,6,16,.9);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@keyframes rwin{from{transform:scale(.72);opacity:0}to{transform:none;opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rw,.rw .rays,#asc .a0{animation:none}#asc .a0{display:none}#asc .a1,#asc .a2,#asc .a3,#asc .a4{animation-name:asc2}.lb,#fade{transition:none}}
@media (min-width:900px){#title{justify-content:center;align-items:flex-start;background:linear-gradient(90deg,rgba(7,6,13,.86) 0,rgba(7,6,13,.5) 34%,rgba(7,6,13,0) 60%)}.tpanel{margin:0 0 0 4vw;width:min(480px,40vw)}.logo{position:static;text-align:left;margin:0 0 18px 4vw}}
@media (max-height:520px){.logo h1{font-size:30px}.hinfo p{display:none}.hb img{max-width:38px}}
</style>

<!--SCRIPTS-->
